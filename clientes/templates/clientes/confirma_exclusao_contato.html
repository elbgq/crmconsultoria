{% extends 'base.html' %}
{% block title %}Confirmar Exclusão{% endblock %}
{% block content %}
<h1>Excluir Contato</h1>
<p>Tem certeza que deseja excluir <strong>{{ contato.nome }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
    <a href="{% url 'clientes:detalhe' contato.empresa.pk %}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
