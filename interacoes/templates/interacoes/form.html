{% extends "base.html" %}
{% block title %}Registrar Interação{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Interação — {{ contato.nome }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'clientes:detalhe_contato' contato.pk %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
