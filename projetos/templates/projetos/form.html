{% extends "base.html" %}
{% block title %}Editar Projeto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Editar Projeto</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'projetos:detalhe' projeto.pk %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
