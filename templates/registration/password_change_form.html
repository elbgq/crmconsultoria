{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Alterar senha</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
        <a href="{% url 'crm_core:home' %}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
